# ---------------------------------------------------------------------------
#  Configuración de nginx dentro del contenedor.
# ---------------------------------------------------------------------------
#  La diferencia con una instalación normal es una sola: aquí nginx y PHP son
#  dos contenedores distintos, así que no se pueden pasar el socket por el
#  sistema de archivos. Se hablan por TCP, al puerto 9000 del contenedor de
#  PHP. Todo lo demás es igual.
#
#  Este archivo se copia dentro del contenedor al levantar, no se edita ahí.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /var/www/reportes;
    index index.php;

    charset utf-8;

    # El formulario manda texto, nunca archivos.
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # Si el archivo no existe, 404 y no se le pasa nada a PHP.
        try_files $uri =404;

        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # "reportes_php" es el nombre del servicio en docker-compose.yml.
        # Docker lo resuelve solo por la red interna; no se pone una IP.
        fastcgi_pass  reportes_php:9000;

        # El clasificador puede tardar hasta 15 segundos en contestar y eso
        # ocurre dentro de la misma petición, así que hay que dar margen.
        fastcgi_read_timeout 60s;
    }

    # El archivo de configuración lleva la contraseña de la base. PHP lo lee
    # desde el disco, pero desde el navegador no tiene por qué bajarse.
    location = /config.php {
        deny all;
        return 404;
    }

    # Tampoco esto.
    location ~ \.(sql|md|ini|log|tmp)$ {
        deny all;
        return 404;
    }

    # Ni los archivos ocultos, como el .git si algún día se sube el proyecto
    # con git.
    location ~ /\. {
        deny all;
        return 404;
    }
}
