; ---------------------------------------------------------------------------
;  Ajustes de PHP para el servidor.
; ---------------------------------------------------------------------------
;  En el servidor los errores no se muestran al visitante, se anotan en el
;  log del contenedor. Si se mostraran, cualquier fallo revelaría rutas del
;  sistema y datos de la conexión a la base.
;
;  Para ver el log:   docker logs reportes_php
; ---------------------------------------------------------------------------

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; Que no se anuncie la versión de PHP en las cabeceras de respuesta. Es un
; dato que no se le da gratis a quien esté buscando por dónde entrar.
expose_php = Off

; El formulario solo manda texto. No hay subida de archivos, así que se
; apaga por completo: menos superficie que cuidar.
file_uploads = Off
upload_max_filesize = 64K
post_max_size = 256K

; Hora del centro del país. Sin esto las fechas del panel salen en UTC y
; parece que los reportes llegaron seis horas antes de lo que llegaron.
date.timezone = America/Mexico_City

max_input_vars = 500
max_execution_time = 30
memory_limit = 128M

; Un detalle de seguridad: con esto nginx no puede terminar sirviendo un
; archivo que no sea PHP por culpa de una ruta armada a mano.
cgi.fix_pathinfo = 0

; Las sesiones viven en el /tmp del contenedor de PHP. Como ese contenedor
; se reinicia de vez en cuando, al reiniciar se cierra la sesión del panel.
; Para un panel interno no molesta. Si llegara a molestar, se le monta un
; volumen en /var/lib/php/sessions y se cambia save_path aquí.
session.gc_maxlifetime = 28800
session.use_strict_mode = 1
session.cookie_httponly = 1

; Nota: la opción session.cookie_samesite existe desde PHP 7.3, así que en
; PHP 5.6 no se puede poner aquí. El atributo SameSite de la cookie se deja
; sin definir, que es el comportamiento normal en los navegadores actuales.
